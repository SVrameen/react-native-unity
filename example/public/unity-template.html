<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ReactNativeUnity</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #unity-container {
        width: 100%;
        height: 100%;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>

    <script>
      // This is a basic template. In actual use, UnityViewWeb.tsx will handle loading and communication
      var unityInstance = null;

      // Sample of how to handle messages from React Native
      function handleMessage(gameObject, methodName, message) {
        if (unityInstance) {
          unityInstance.SendMessage(gameObject, methodName, message);
        }
      }

      // Sample of how to send messages to React Native
      function sendMessageToReactNative(message) {
        window.ReactNativeUnityPostMessage({ data: message });
      }
    </script>
  </body>
</html>
